name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: python -m pytest

  stabil-live-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Install tvDatafeed
        run: python -m pip install git+https://github.com/rongardF/tvdatafeed.git
      - name: THYAO Stabil smoke
        run: python scripts/live_smoke.py --symbol THYAO --days 550 --max-bars 50000 --cache-root .cache/stabil-live-smoke
