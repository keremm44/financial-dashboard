name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev,ui]'
      - name: Test
        run: python -m pytest
      - name: Architecture audit
        run: python tools/architecture_audit.py --check
      - name: Shell ownership audit
        run: python tools/shell_ownership_audit.py --check
