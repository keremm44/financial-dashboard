name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: python -m pytest

  auction-live-smoke:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/auction-volume-profile'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install app
        run: python -m pip install -e '.[dev]'
      - name: Install tvDatafeed
        run: python -m pip install --upgrade --no-cache-dir git+https://github.com/rongardF/tvdatafeed.git
      - name: THYAO live smoke
        run: python scripts/live_smoke.py --symbol THYAO --days 14 --max-bars 3000 --cache-root .cache/auction-live-smoke
