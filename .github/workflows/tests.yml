name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: python -m pytest

  stabil-live-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Install tvDatafeed
        run: python -m pip install git+https://github.com/rongardF/tvdatafeed.git
      - name: Canonical pipeline smoke
        run: python scripts/live_smoke.py --symbol THYAO --days 550 --max-bars 50000 --cache-root .cache/stabil-live-smoke
      - name: Direct W D H4 engine-only smoke
        shell: bash
        run: |
          python - <<'PY'
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          from financial_dashboard.data.tvdatafeed_provider import TvDatafeedProvider
          from financial_dashboard.engines import StabilTrendEngine

          tz = ZoneInfo("Europe/Istanbul")
          end = datetime.now(tz)
          start = end - timedelta(days=2500)
          provider = TvDatafeedProvider(exchange="BIST", max_bars=5000)
          weekly = provider.get_ohlcv("THYAO", "1w", start, end)
          daily = provider.get_ohlcv("THYAO", "1d", start, end)
          h4 = provider.get_ohlcv("THYAO", "4h", start, end)

          # TvDatafeed marks non-intraday weekly bars closed generically; drop the latest
          # weekly row so this smoke cannot consume the current forming week.
          if len(weekly) > 1:
              weekly = weekly.iloc[:-1].reset_index(drop=True)

          engine = StabilTrendEngine()
          export = engine.analyze(weekly, daily, h4)
          print("DIRECT_STABIL_ROWS", len(weekly), len(daily), len(h4))
          print("DIRECT_STABIL_EXPORT", export)
          print("DIRECT_STABIL_RESULT", engine.engine_result())
          assert export.weekly.data_ready, "weekly snapshot not ready"
          assert export.daily.data_ready, "daily snapshot not ready"
          assert export.ready, "final Stabil export not ready"
          assert export.state_code in range(1, 8)
          assert export.health is not None
          assert export.risk is not None
          print("DIRECT_STABIL_OK")
          PY
