[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-dashboard"
version = "0.1.0"
description = "Local-first OHLCV analysis and financial dashboard engine"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16",
    "yfinance>=0.2.65,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-xdist>=3",
]
ui = [
    "streamlit>=1.40,<2",
    "plotly>=5.24,<7",
]
live = [
    "tvdatafeed-enhanced==2.2.1",
    "websocket-client>=1.8,<2",
]

[project.scripts]
financial-dashboard-ui = "financial_dashboard.ui.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --durations=10"
